# Codex overlay. The projector merges `defaults` with each role's entry and emits
# the result as top-level TOML keys after `developer_instructions`.
# `instructions_prefix` is prepended to the role body; `{source}` is the role's
# repository path.
# `commands_output` is where a command lands: a Codex skill, which has no
# `$ARGUMENTS`, so `commands_arguments` replaces it. See ADR-0005.
output: .codex/agents/{name}.toml
skills_output: .agents/skills
commands_output: .agents/skills/{name}/SKILL.md
commands_arguments: "the request that invoked this skill"
instructions_prefix: "Read AGENTS.md first. The authoritative role source is {source}. Resolve its relative links against that path in the repository."
defaults:
  model: gpt-6.1-sol
  model_reasoning_effort: medium
# Codex has no per-agent tool key; a role's read-only boundary is its contract.
roles:
  spec-author:
    model_reasoning_effort: high
  architect:
    model_reasoning_effort: high
  spec-reviewer:
    model_reasoning_effort: high
  test-writer: {}
  implementer: {}
  benchmarker: {}
  # Judgement roles: a wrong reading or a missed finding costs the most.
  analyst:
    model_reasoning_effort: high
  bug-finder:
    model_reasoning_effort: high
  adversary:
    model_reasoning_effort: high
  auditor:
    model_reasoning_effort: high
  domain:
    model_reasoning_effort: high
  # Execution roles bounded by an upstream artifact: the default effort.
  organizer: {}
  tester: {}
  pair-programmer: {}
  yak-shaver: {}
  ux: {}
  ui: {}
  release: {}
  build: {}
  # Prose: low effort is enough.
  document-writer:
    model_reasoning_effort: low
