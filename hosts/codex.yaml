# Codex overlay. The projector merges `defaults` with each role's entry and emits
# the result as top-level TOML keys after `developer_instructions`.
# `instructions_prefix` is prepended to the role body; `{source}` is the role's
# repository path.
output: .codex/agents/{name}.toml
skills_output: .agents/skills
instructions_prefix: "Read AGENTS.md first. The authoritative role source is {source}. Resolve its relative links against that path in the repository."
defaults:
  model: gpt-6.1-sol
  model_reasoning_effort: medium
roles:
  spec-author:
    model_reasoning_effort: high
  architect:
    model_reasoning_effort: high
  spec-reviewer:
    model_reasoning_effort: high
  test-writer: {}
  implementer: {}
  benchmarker: {}
  # Judgement roles: a wrong reading or a missed finding costs the most.
  analyst:
    model_reasoning_effort: high
  critic:
    model_reasoning_effort: high
  bug-finder:
    model_reasoning_effort: high
  adversary:
    model_reasoning_effort: high
  auditor:
    model_reasoning_effort: high
  domain:
    model_reasoning_effort: high
  # Execution roles bounded by an upstream artifact: the default effort.
  organizer: {}
  tester: {}
  bug-fixer: {}
  pair-programmer: {}
  yak-shaver: {}
  metric-nerd: {}
  ux: {}
  ui: {}
  release: {}
  build: {}
  # Mechanical reading and prose: low effort is enough.
  document-writer:
    model_reasoning_effort: low
  log-parser:
    model_reasoning_effort: low
