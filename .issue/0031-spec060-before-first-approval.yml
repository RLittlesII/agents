summary: |
  Port-gap review H11, left open by 0005. ADR-0006 decides a § 9 Missing row
  blocks the merge, not approval, and defers the checker side: SPEC060 fails
  an approved specification that still has a Missing cell, so
  .specht/manifest.json must set "rules": { "SPEC060": "off" } before the
  first specification is approved. Nothing enforced that deferral once 0005
  closed. This item is the reminder: it gates the first approval.

  The manifest edit needs the repository owner's go-ahead (ADR-0004 limits
  hand edits under .specht/ to exclusions; ADR-0006 amends that for this
  one key).

acceptance_criteria:
  - ".specht/manifest.json sets SPEC060 to off, with the owner's approval recorded in decisions."
  - "dotnet specht --strict passes with an approved specification that still carries a Missing § 9 row."
  - "No specification's spec_status is set to approved before this item is done."

decisions:
  - "2026-10-14, repository owner: approved setting SPEC060 to off in .specht/manifest.json, the one hand edit beyond exclusions that ADR-0006 grants."
  - "2026-10-14: verified by probe. With 0001-F5 set to spec_status approved and its § 12 row approved, carrying 41 Missing § 9 rows, dotnet specht --strict reports 0 errors; the same probe on the previous manifest fails SPEC060 on each row. Probe reverted. SPEC061 still requires every § 12 row approved before spec_status approved."

