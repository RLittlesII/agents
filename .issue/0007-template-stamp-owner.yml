upstream_request: |
  specht: the feature template hard-codes each section's "last written by"
  role. §§ 6-7 say implementer; this repository's ownership table says
  architect, so every copy carries the wrong owner and a consumer cannot fix
  it without hand-editing a tool-owned file. Ask: let the manifest declare an
  owner per section (for example "sections": [{"key": "6", "owner":
  "architect"}]) and render {{owner}} into the stamp, or emit a neutral
  "<!-- last written by: {{owner}}, {{date}} -->" placeholder the author
  fills. Either way, a rule that flags a stamp naming a role other than the
  declared owner would let consumers drop their own check.

  Additional request scope: route ownership, sign-off recording, tracker/mirror
  mapping, priority and test-stack guidance through consumer policy; distinguish
  current applicable approvals from retained verdict history. Do not export this
  repository's roster or change checker/schema behavior without upstream claims.
  Neutral placeholders avoid adding a configuration API; configurable owners need
  explicit agreement. Preserve published snapshots and settle target pins before
  implementation. Proposed checks use alternate owner, local-tracker and
  non-Reqnroll fixtures, consistent priority guidance, preserved approval history
  and immutable version/pin behavior. These are proposed upstream checks, not
  approved claims or completed tests.
