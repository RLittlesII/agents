  Correct workflow guidance that turns agreement and design handoffs into
  separate pull requests instead of continuing the authorized delivery.
acceptance_criteria:
  - Default to one pull request containing the agreement delta, design, tests and implementation for a bounded delivery.
  - Preserve explicit phase-only requests, genuine approval holds and independently deliverable splits.
  - Clarify that a phase handoff does not finish a parent delivery request or require a merge to continue.
  - Start at the requested phase, reuse valid earlier artifacts and approvals, and continue to a reviewed PR by default.
  - Keep standalone reviews, diagnostic test runs and queue recommendations bounded.
  - Regenerate host outputs and run specification, projection and repository checks.
