  - "skills/next states the per-stage gates and the derived-blocked rule."
  - "Hooked decisions worth keeping are carried as decision records; the rest are named as rejected."
  - "dotnet fsi scripts/project.fsx --check, dotnet fsi scripts/project.tests.fsx and dotnet specht --strict pass."

