summary: |
  Port-gap review M34, M35 and L7.
  - M34: no commands for opening a pull request or acting on review
    feedback, though vNext.summary.md:32,35 lists both (LTI
    review/open-pull-request.md, fix-feedback.md).
  - M35: no backlog commands: create item, prioritise without a full groom,
    the health snapshot with its "what is tracked nowhere" check (LTI
    backlog/*.md).
  - L7: single-role commands (audit, tidy, benchmark, parse-logs, adr)
    carried halts; 0001-F3 § 5 row 1 excludes them only if they add nothing.

