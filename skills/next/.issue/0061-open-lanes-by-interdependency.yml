summary: |
  Replace the portable one-delivery-child-per-Feature cap with a no-overlap
  check. Candidates start in parallel only when they overlap neither each other
  nor taken work; overlap is a dependency on the other's result or any shared
  file, read from branch diffs and record evidence; undeterminable overlap counts
  as overlap, and unscored and standalone work takes the same test. Decision 0022 supersedes decision 0021, withdraws B-046 and carves
  B-034.
