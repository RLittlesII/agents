name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
    inputs:
      base:
        description: Explicit Git comparison base
        required: true
        type: string

permissions:
  contents: read

jobs:
  installer:
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Test the installer without network or installed managers
        run: python -m unittest discover -s install -p "test_*.py" -v

  check:
    runs-on: ubuntu-latest
    env:
      DOTNET_NOLOGO: "1"
      DOTNET_CLI_TELEMETRY_OPTOUT: "1"
      NuGetPackageSourceCredentials_specht: "Username=${{ vars.SPECHT_PACKAGES_USER }};Password=${{ secrets.SPECHT_PACKAGES_TOKEN }};ValidAuthenticationTypes=Basic"
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install pinned coverage collector
        run: python3 -m pip install -r .github/coverage/requirements.txt

      - name: Restore tools
        run: dotnet tool restore

      - name: Check specifications
        run: dotnet specht --strict

      - name: Check projected outputs
        run: dotnet fsi scripts/project.fsx --check

      - name: Test the projector
        run: dotnet fsi scripts/project.tests.fsx

      - name: Enforce changed-line coverage with the local gate
        env:
          COVERAGE_BASE: ${{ github.event.pull_request.base.sha || github.event.before || inputs.base }}
        run: python3 .github/coverage/run.py --base "$COVERAGE_BASE"

      - name: Retain coverage diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-diagnostics
          path: .artifacts/coverage/
          include-hidden-files: true
          if-no-files-found: ignore
